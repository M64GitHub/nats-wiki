# Run D — one tenant account with JetStream limits, and one without, on the same server.
# nats-server v2.14.6.
server_name: limitsD
listen: 127.0.0.1:4321
http: 127.0.0.1:8321

jetstream {
  store_dir: "./storeD"
}

accounts {
  TENANT {
    users: [ { user: t, password: t } ]
    jetstream: {
      max_mem: 16MB
      max_file: 64MB
      max_streams: 3
      max_consumers: 2
    }
  }
  FREE {
    users: [ { user: f, password: f } ]
    jetstream: enabled
  }
  $SYS { users: [ { user: sys, password: sys } ] }
}
